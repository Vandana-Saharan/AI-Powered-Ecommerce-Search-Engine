<!doctype html>
<html lang="en" data-theme="dark" data-palette="aurora">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search millions of products with lightning-fast full-text search. Find exactly what you're looking for." />
    <meta name="theme-color" content="#0B1020" />
    <title>ShopSearch — Intelligent Product Discovery</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("shopsearch-mode") || "dark";
          var palette = localStorage.getItem("shopsearch-palette") || "aurora";
          document.documentElement.setAttribute("data-theme", mode);
          document.documentElement.setAttribute("data-palette", palette);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
